<!DOCTYPE html>
<html>
<head>
    <title>Five Nights at Freddys 1: Redrawn</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="game-wrapper">
        <div id="viewport">


            <div id="game-world">
                <img id="office-background" src="images/background/office-background.png" alt="office-backgrond">

                <img id="left-door-button" src="images/doors-buttons/left-door-button-off.png" alt="left-door-button-off">
                <img id="left-light-button" src="images/doors-buttons/left-light-button-off.png" alt="left-light-button-off">
                <img id="right-door-button" src="images/doors-buttons/right-door-button-off.png" alt="right-door-button-off">
                <img id="right-light-button" src="images/doors-buttons/right-light-button-off.png" alt="right-light-button-off">

                <img id="left-doorway-light" src="images/doors-buttons/left-doorway-light.png" alt="left-doorway-light">
                <img id="left-doorway-bonnie" src="images/doors-buttons/left-doorway-bonnie.png" alt="left-doorway-bonnie">
                <img id="right-doorway-light" src="images/doors-buttons/right-doorway-light.png" alt="right-doorway-light">

                <img id="left-door" src="images/doors-buttons/left-door.png" alt="left-door">
                <img id="left-door-overlay" src="images/doors-buttons/left-door-overlay.png" alt="left-door-overlay">
                <img id="right-door" src="images/doors-buttons/right-door.png" alt="right-door">
                <img id="right-door-overlay" src="images/doors-buttons/right-door-overlay.png" alt="right-door-overlay">


                <img id="left-window-light" src="images/doors-buttons/left-window-light.png" alt="left-window-light">
                <img id="left-window-bonnie" src="images/doors-buttons/left-window-bonnie.png" alt="left-window-bonnie">
                <img id="right-window-light" src="images/doors-buttons/right-window-light.png" alt="right-window-light">
                <img id="right-window-chica" src="images/doors-buttons/right-window-chica.png" alt="right-window-chica">
            </div> <!-- end game-world -->


            <div id="monitor-ui">
                <img id="monitor-animation" src="images/monitor/monitor-frame0.png" alt="monitor-animation">

                <div id="monitor-screen">
                    <div id="camera-ui">
                        <img id="camera-background" src="images/monitor/cam-1a.png" alt="camera-background">

                        <img id="camera-outline" src="images/monitor/camera-outline.png" alt="camera-outline">

                        <img id="recording-light" src="images/monitor/recording-light.png" alt="recording-light">

                        <img id="camera-map" src="images/monitor/camera-map.png" alt="camera-map">
                        
                        <div id="camera-buttons-div">
                            <img id="cam-1a-button" src="images/monitor/cam-1a-button-on.png" alt="cam-1a-button">
                            <img id="cam-1b-button" src="images/monitor/cam-1b-button-off.png" alt="cam-1b-button">
                            <img id="cam-1c-button" src="images/monitor/cam-1c-button-off.png" alt="cam-1c-button">
                            <img id="cam-2a-button" src="images/monitor/cam-2a-button-off.png" alt="cam-2a-button">
                            <img id="cam-2b-button" src="images/monitor/cam-2b-button-off.png" alt="cam-2b-button">
                            <img id="cam-3-button"  src="images/monitor/cam-3-button-off.png" alt="cam-3-button">
                            <img id="cam-4a-button" src="images/monitor/cam-4a-button-off.png" alt="cam-4a-button">
                            <img id="cam-4b-button" src="images/monitor/cam-4b-button-off.png" alt="cam-4b-button">
                            <img id="cam-5-button"  src="images/monitor/cam-5-button-off.png" alt="cam-5-button">
                            <img id="cam-6-button"  src="images/monitor/cam-6-button-off.png" alt="cam-6-button">
                            <img id="cam-7-button"  src="images/monitor/cam-7-button-off.png" alt="cam-7-button">
                        </div> <!-- end camera-buttons-div -->
                    </div> <!-- end camera-ui -->

                    <div id="night-select-screen">
                        <img id="night-select-select-night-text" src="images/text/select-night-text.png" alt="night-select-select-night-text">
                        <img id="night-select-border" src="images/monitor/camera-outline.png" alt="night-select-border">
                        <img id="night-select-night-1-text" src="images/text/night1-text.png" alt="night-select-night-1-text">
                        <img id="night-select-night-2-text" src="images/text/night2-text.png" alt="night-select-night-2-text">
                        <img id="night-select-night-3-text" src="images/text/night3-text.png" alt="night-select-night-3-text">
                        <img id="night-select-night-4-text" src="images/text/night4-text.png" alt="night-select-night-4-text">
                        <img id="night-select-night-5-text" src="images/text/night5-text.png" alt="night-select-night-5-text">
                        <img id="night-select-back-text" src="images/text/back-text.png" alt="night-select-back-test">
                    </div> <!-- end night-select-screen -->

                    <div id="options-menu">
                        <img id="options-menu-border" src="images/monitor/camera-outline.png" alt="options-menu-border">
                        <img id="options-menu-options-text" src="images/text/options-text.png" alt="options-menu-options-text">
                        <img id="options-menu-back-text" src="images/text/back-text.png" alt="options-menu-back-text">
                    </div>

                </div> <!-- end monitor-screen -->

                <img id="monitor-button" src="images/ui/monitor-button.png" alt="monitor-button">
                <div id="monitor-button-hitbox"></div>
            </div> <!-- end monitor-ui -->


            <div id="user-interface">
                <!-- TODO battery percent, night, etc. -->
                 <img id="time-text" src="images/text/time-12am-text.png" alt="time-text">
            </div> <!-- end user-interface -->


            <div id="title-screen">
                <img id="title-background" src="images/title/title-background.png" alt="title-background">
                <img id="play-button" src="images/text/play-button.png" alt="play-button">
                <img id="options-button" src="images/text/options-button.png" alt="options-button">
            </div> <!-- end title-screen -->


            <div id="fade-black-screen">
                <img id="night-text" src="images/text/night1-text.png" alt="night-text">
                <img id="time-1200am-text" src="images/text/time-1200am-text.png" alt="time-1200am-text">
            </div> <!-- end fade-black-screen -->           


        </div> <!-- end viewport -->

    </div> <!-- end game-wrapper -->

</body>
</html>
